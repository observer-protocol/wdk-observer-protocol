<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observer Protocol — Early Adopters</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #e0e6ed;
            line-height: 1.6;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 40px;
            border-bottom: 1px solid #1a2332;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4aa 0%, #00a8e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #6b7b8f;
            font-size: 1.1rem;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }
        .stat-card {
            background: #111827;
            border: 1px solid #1a2332;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00d4aa;
        }
        .stat-label {
            color: #6b7b8f;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .section {
            margin-bottom: 60px;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            text-transform: uppercase;
        }
        .status-mainnet_beta { background: #00d4aa; color: #0a0e1a; }
        .status-integration_live { background: #00a8e8; color: #0a0e1a; }
        .status-in_discussion { background: #f59e0b; color: #0a0e1a; }
        .status-positioning_active { background: #8b5cf6; color: #fff; }
        .adopter-card {
            background: #111827;
            border: 1px solid #1a2332;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        .adopter-card:hover {
            border-color: #00d4aa;
        }
        .adopter-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .adopter-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
        }
        .adopter-repo {
            color: #6b7b8f;
            font-size: 0.9rem;
            font-family: monospace;
        }
        .adopter-repo a {
            color: #00a8e8;
            text-decoration: none;
        }
        .adopter-repo a:hover {
            text-decoration: underline;
        }
        .adopter-description {
            color: #9ca3af;
            margin-bottom: 16px;
        }
        .adopter-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.85rem;
            color: #6b7b8f;
        }
        .adopter-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }
        .tag {
            background: #1a2332;
            color: #9ca3af;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
        }
        .notes {
            margin-top: 16px;
            padding: 16px;
            background: #0d1117;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #9ca3af;
            border-left: 3px solid #00d4aa;
        }
        .next-action {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #f59e0b;
        }
        footer {
            text-align: center;
            padding-top: 40px;
            border-top: 1px solid #1a2332;
            color: #6b7b8f;
            font-size: 0.9rem;
        }
        footer a {
            color: #00a8e8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Observer Protocol</h1>
            <p class="subtitle">Early Adopters & Mainnet Beta Deployments</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="stat-mainnet_beta">1</div>
                <div class="stat-label">Mainnet Beta</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-live">2</div>
                <div class="stat-label">Integration Live</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-discussion">2</div>
                <div class="stat-label">In Discussion</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-positioning">1</div>
                <div class="stat-label">Positioning Active</div>
            </div>
        </div>

        <section class="section">
            <h2 class="section-title">🏆 Mainnet Beta Deployments</h2>
            <div id="mainnet_beta-adopters"></div>
        </section>

        <section class="section">
            <h2 class="section-title">🔧 Integration Live</h2>
            <div id="live-integrations"></div>
        </section>

        <section class="section">
            <h2 class="section-title">💬 In Discussion</h2>
            <div id="in-discussion"></div>
        </section>

        <section class="section">
            <h2 class="section-title">🎯 Positioning Active</h2>
            <div id="positioning-active"></div>
        </section>

        <footer>
            <p>Want to integrate? <a href="https://observerprotocol.org">observerprotocol.org</a> · <a href="https://api.observerprotocol.org/docs">API Docs</a></p>
            <p style="margin-top: 8px; font-size: 0.8rem;">Last updated: <span id="last-updated"></span></p>
        </footer>
    </div>

    <script>
        // Load adopters data
        fetch('/adopters/data.json')
            .then(r => r.json())
            .then(data => {
                renderAdopters(data);
                document.getElementById('last-updated').textContent = new Date(data.metadata.updated).toLocaleDateString();
            })
            .catch(err => {
                console.error('Failed to load adopters:', err);
                // Fallback to embedded data for static hosting (v2.0 structure)
                renderAdopters({
                    "mainnet_beta": [
                        {
                            "name": "AgentPay (joepangallo)",
                            "repository": "joepangallo/mcp-server-agentpay",
                            "description": "Cross-protocol payment router MCP server for AI agents (Lightning, x402, Solana). Agents using this server get OP verification.",
                            "status": "mainnet_beta",
                            "deployed_date": "2026-03-08",
                            "contact": "joepangallo",
                            "notes": "First mainnet beta deployment. API key incident handled privately. Joint announcement pending one week stable operation.",
                            "tags": ["payments", "multi-rail", "mcp-server", "mainnet_beta"]
                        }
                    ],
                    "active_discussions": [
                        {
                            "name": "lnget",
                            "repository": "lightninglabs/lnget",
                            "description": "Lightning Labs CLI for L402 payments",
                            "status": "integration_live",
                            "notes": "Built same-day reputation layer when lnget v1.0 shipped. Live endpoint: /observer/lnget-attest",
                            "tags": ["lightning-labs", "l402", "cli"]
                        },
                        {
                            "name": "Tether WDK",
                            "repository": "tether/wdk",
                            "description": "Wallet Development Kit for multi-chain agent wallets",
                            "status": "integration_live",
                            "notes": "verified_send() primitive: verify both parties → check reputation → execute payment.",
                            "tags": ["tether", "multi-chain", "wallet"]
                        },
                        {
                            "name": "AIBTC",
                            "repository": "aibtcdev/aibtc-mcp-server",
                            "description": "Bitcoin L2 (Stacks) AI agent framework",
                            "status": "active_discussion",
                            "next_action": "Awaiting address format preference",
                            "notes": "Strong technical alignment. Arc from Trustless Indra engaged.",
                            "tags": ["bitcoin-l2", "stacks", "identity"]
                        },
                        {
                            "name": "SatGate",
                            "repository": "SatGate-io/satgate",
                            "description": "L402 Gateway for AI Agents with budget enforcement",
                            "status": "active_discussion",
                            "next_action": "30-minute technical call to align on macaroon caveat format",
                            "notes": "Economic Firewall concept + OP reputation scores.",
                            "tags": ["l402", "gateway", "budget"]
                        }
                    ],
                    "strategic_positioning": [
                        {
                            "name": "MPP (Stripe × Tempo)",
                            "description": "Machine Payments Protocol by Stripe and Tempo",
                            "status": "positioning_active",
                            "next_action": "Boyd reaching out to Stripe exec",
                            "notes": "MPP solves machine payments, not machine identity. OP = trust layer.",
                            "tags": ["stripe", "mpp", "institutional"]
                        }
                    ],
                    "hackathons": [
                        {
                            "name": "Tether Hackathon Galáctica",
                            "description": "Tether's Wallet Development Kit hackathon",
                            "status": "submitted",
                            "deadline": "2026-03-22",
                            "notes": "WDK + Observer Protocol Integration submitted.",
                            "tags": ["tether", "wdk", "hackathon"]
                        }
                    ]
                });
            });

        function renderAdopters(data) {
            // Handle new data structure (v2.0)
            const mainnet_beta = data.mainnet_beta || [];
            const live = data.active_discussions?.filter(p => p.status === 'integration_live') || [];
            const discussion = data.active_discussions?.filter(p => p.status === 'active_discussion' || p.status === 'outreach_sent' || p.status === 'identified') || [];
            const positioning = data.strategic_positioning || [];
            const hackathons = data.hackathons || [];

            document.getElementById('mainnet_beta-adopters').innerHTML = mainnet_beta.map(renderCard).join('');
            document.getElementById('live-integrations').innerHTML = live.map(renderCard).join('');
            document.getElementById('in-discussion').innerHTML = discussion.map(renderCard).join('');
            document.getElementById('positioning-active').innerHTML = [...positioning, ...hackathons].map(renderCard).join('');
        }

        function renderCard(item) {
            const repo = item.repository ? 
                `<div class="adopter-repo"><a href="https://github.com/${item.repository}" target="_blank">${item.repository}</a></div>` : '';
            
            const deployed = item.deployed_date ? 
                `<span>📅 ${item.deployed_date}</span>` : '';
            
            const contact = item.contact ? 
                `<span>👤 ${item.contact}</span>` : '';

            const nextAction = item.next_action ? 
                `<div class="next-action">➡️ Next: ${item.next_action}</div>` : '';

            const notes = item.notes ? 
                `<div class="notes">${item.notes}</div>` : '';

            const tags = item.tags ? 
                `<div class="tags">${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : '';

            return `
                <div class="adopter-card">
                    <div class="adopter-header">
                        <div>
                            <div class="adopter-name">${item.name}</div>
                            ${repo}
                        </div>
                        <span class="status-badge status-${item.status}">${item.status.replace('_', ' ')}</span>
                    </div>
                    <div class="adopter-description">${item.description}</div>
                    <div class="adopter-meta">
                        ${deployed}
                        ${contact}
                    </div>
                    ${notes}
                    ${nextAction}
                    ${tags}
                </div>
            `;
        }
    </script>
</body>
</html>
